# Public port 9001 of Craig: ennuizel streamer.
# A plain TCP relay to the craig container in ../craig, so HTTP, WebSocket and
# large downloads pass through untouched. Start ../craig first: it creates the
# network.
name: craig-ez

services:
  proxy:
    image: alpine/socat:1.8.0.3
    container_name: craig-ez
    restart: unless-stopped
    command: TCP-LISTEN:9001,fork,reuseaddr,nodelay TCP:craig:9001,nodelay
    ports:
      - "9001:9001"
    networks:
      - craig

networks:
  craig:
    name: craig_default
    external: true
