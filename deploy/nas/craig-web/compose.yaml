# Public port 9002 of Craig: webapp.
# A plain TCP relay to the craig container in ../craig, so HTTP, WebSocket and
# large downloads pass through untouched. Start ../craig first: it creates the
# network.
name: craig-web

services:
  proxy:
    image: alpine/socat:1.8.0.3
    container_name: craig-web
    restart: unless-stopped
    command: TCP-LISTEN:9002,fork,reuseaddr,nodelay TCP:craig:9002,nodelay
    ports:
      - "9002:9002"
    networks:
      - craig

networks:
  craig:
    name: craig_default
    external: true
